<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenAI Codex 教學、工具與工作流程繁體中文懶人包">
  <title>Codex 懶人包｜OpenAI Codex</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #64748b;
      --paper: #f8fafc;
      --card: #ffffff;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --line: #dbe4f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(145deg, #eff6ff 0%, var(--paper) 50%, #ecfeff 100%);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(100% - 2rem, 1080px);
      margin: 0 auto;
      padding: clamp(2rem, 7vw, 6rem) 0;
    }

    .hero, .card {
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      background: color-mix(in srgb, var(--card) 90%, transparent);
      box-shadow: 0 1rem 3rem rgb(30 64 175 / 8%);
    }

    .hero { padding: clamp(1.5rem, 5vw, 4rem); }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .08em; }
    h1 { max-width: 14ch; margin: .35rem 0 1rem; font-size: clamp(2.2rem, 7vw, 5rem); line-height: 1.1; }
    h2 { margin-top: 0; }
    .lead { max-width: 48rem; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.3rem); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-top: 1rem; }
    .card { padding: 1.35rem; }
    .tag { display: inline-block; padding: .25rem .65rem; border-radius: 999px; color: #1e3a8a; background: var(--accent-soft); font-size: .9rem; }
    a { color: var(--accent); }
    footer { margin-top: 1.5rem; color: var(--muted); font-size: .95rem; }

    @media (max-width: 760px) {
      main { width: min(100% - 1rem, 680px); padding-top: 1rem; }
      .grid { grid-template-columns: 1fr; }
      .hero { border-radius: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <span class="eyebrow">OPENAI CODEX TOOLKIT</span>
      <h1>把 Codex 用成可靠的工作夥伴</h1>
      <p class="lead">整理 OpenAI Codex 的教學、工具與工作流程，讓 AI 協作從第一次嘗試，逐步變成可重複、可驗證、可交接的日常方法。</p>
      <p><span class="tag">繁體中文</span> <span class="tag">教學導向</span> <span class="tag">可驗證流程</span></p>
    </section>

    <section class="grid" aria-label="專案內容">
      <article class="card">
        <h2>教學指南</h2>
        <p>從基本操作、提示設計到專案協作，整理適合逐步學習的說明。</p>
      </article>
      <article class="card">
        <h2>工具與技能</h2>
        <p>記錄工具用途、安裝方式、權限範圍與最小驗證方法。</p>
      </article>
      <article class="card">
        <h2>工作流程</h2>
        <p>建立開工、執行、驗證與收工的可交接流程，降低遺漏與重工。</p>
      </article>
    </section>

    <footer>專案文件將持續整理中。返回 <a href="https://github.com/">GitHub</a> 查看 repository。</footer>
  </main>
</body>
</html>
